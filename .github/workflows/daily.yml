name: IC IM spread monitor
on:
  push:
    branches: [codex/ic-im-monitor-v2]
    paths:
      - '.github/workflows/daily.yml'
      - 'monitor.py'
      - 'report.py'
      - 'tests.py'
      - 'requirements.txt'
      - 'trading_calendar.json'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '补录自然日数（首次可填365）'
        type: number
        default: 0
      refresh_data:
        description: '重新访问交易所验证云端行情网络'
        type: boolean
        default: false
      test_connection:
        description: '发送一次接入测试（不发送当日日报）'
        type: boolean
        default: false
      send_message:
        description: '本次确实发送微信日报（默认仅生成）'
        type: boolean
        default: false
      retry_push:
        description: '已核对接收状态，允许重发'
        type: boolean
        default: false
  schedule:
    - cron: '37 18 * * 1-5'
      timezone: Asia/Shanghai
permissions:
  contents: read
concurrency:
  group: ic-im-monitor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regression tests
        run: python -m unittest -v tests.py
      - name: Generate report
        id: generate
        env:
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '0' }}
          REFRESH_DATA: ${{ inputs.refresh_data }}
        shell: bash
        run: |
          flags=()
          [[ "$REFRESH_DATA" != "true" ]] || flags+=(--refresh)
          python monitor.py --no-push --backfill-days "$BACKFILL_DAYS" "${flags[@]}"
      - name: Persist data even if notification failed
        if: ${{ always() && steps.generate.outcome != 'skipped' }}
        run: |
          git config user.name 'ic-monitor-bot'
          git config user.email 'ic-monitor-bot@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update IC IM data and notification state'
            git push
          fi
      - name: Archive report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ic-im-report
          path: |
            output/
            data/history.csv
            data/ingest_status.json
          retention-days: 30
          if-no-files-found: warn
  pages:
    needs: report
    if: ${{ vars.ENABLE_PAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ic-im-report
          path: artifact
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifact/output
      - name: Deploy report (opt-in)
        id: deployment
        uses: actions/deploy-pages@v4
  notify:
    needs: [report, pages]
    if: >-
      ${{ always() && needs.report.result == 'success' &&
      (needs.pages.result == 'success' || needs.pages.result == 'skipped') &&
      ((github.event_name == 'schedule' && vars.ENABLE_PUSH == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.send_message || inputs.test_connection))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ic-im-report
          path: .
      - name: Reserve submission without sending
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
          RETRY_PUSH: ${{ inputs.retry_push }}
          TEST_CONNECTION: ${{ inputs.test_connection }}
        shell: bash
        run: |
          flags=()
          [[ "$RETRY_PUSH" != "true" ]] || flags+=(--retry-push)
          mode=--notify-only
          [[ "$TEST_CONNECTION" != "true" ]] || mode=--test-notice
          python monitor.py "$mode" --reserve-only "${flags[@]}"
      - name: Durably save reservation before API call
        run: |
          git config user.name 'ic-monitor-bot'
          git config user.email 'ic-monitor-bot@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Reserve daily notification before submission'
            git push
          fi
      - name: Submit today's report after publication
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
          TEST_CONNECTION: ${{ inputs.test_connection }}
        shell: bash
        run: |
          mode=--notify-only
          [[ "$TEST_CONNECTION" != "true" ]] || mode=--test-notice
          python monitor.py "$mode" --use-reservation
      - name: Persist notification state on success or failure
        if: always()
        run: |
          git config user.name 'ic-monitor-bot'
          git config user.email 'ic-monitor-bot@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Record notification submission state'
            git push
          fi
  failure_alert:
    needs: [report, pages, notify]
    if: >-
      ${{ always() &&
      (needs.report.result == 'failure' || needs.pages.result == 'failure' || needs.notify.result == 'failure') &&
      ((github.event_name == 'schedule' && vars.ENABLE_PUSH == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.send_message || inputs.test_connection))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve failure alert without sending
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
        run: python monitor.py --failure-notice --reserve-only
      - name: Durably save alert reservation before API call
        run: |
          git config user.name 'ic-monitor-bot'
          git config user.email 'ic-monitor-bot@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Reserve failure alert before submission'
            git push
          fi
      - name: Send one daily failure alert
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
          MONITOR_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python monitor.py --failure-notice --use-reservation
      - name: Persist alert state
        if: always()
        run: |
          git config user.name 'ic-monitor-bot'
          git config user.email 'ic-monitor-bot@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Record failure alert state'
            git push
          fi
