name: IC IM spread monitor
on:
  push:
    branches: [codex/ic-im-monitor-v2]
    paths:
      - '.github/workflows/daily.yml'
      - 'monitor.py'
      - 'report.py'
      - 'tests.py'
      - 'requirements.txt'
      - 'trading_calendar.json'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '补录自然日数（首次可填365）'
        type: number
        default: 0
      refresh_data:
        description: '重新访问交易所验证云端行情网络'
        type: boolean
        default: false
      test_connection:
        description: '发送一次接入测试（不发送当日日报）'
        type: boolean
        default: false
      send_message:
        description: '本次确实发送微信日报（默认仅生成）'
        type: boolean
        default: false
      retry_push:
        description: '已核对接收状态，允许重发'
        type: boolean
        default: false
      send_email:
        description: '本次发送邮件日报（默认不发）'
        type: boolean
        default: false
      test_email:
        description: '发送一次邮件接入测试'
        type: boolean
        default: false
  schedule:
    - cron: '37 18,20,22 * * 1-5'
      timezone: Asia/Shanghai
permissions:
  contents: read
concurrency:
  group: ic-im-monitor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      report_date: ${{ steps.generate.outputs.report_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regression tests
        run: python -m unittest -v tests.py
      - name: Generate report
        id: generate
        env:
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '0' }}
          REFRESH_DATA: ${{ inputs.refresh_data }}
        shell: bash
        run: |
          flags=()
          [[ "$REFRESH_DATA" != "true" ]] || flags+=(--refresh)
          report_date=$(python monitor.py --print-report-date)
          echo "report_date=$report_date" >> "$GITHUB_OUTPUT"
          days=$BACKFILL_DAYS
          [[ "$days" != "0" ]] || days=14
          python monitor.py --no-push --date "$report_date" --backfill-days "$days" "${flags[@]}"
      - name: Persist data even if notification failed
        if: ${{ always() && steps.generate.outcome != 'skipped' }}
        run: |
          git config user.name 'ic-monitor-bot'
          git config user.email 'ic-monitor-bot@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update IC IM data and notification state'
            git push
          fi
      - name: Archive report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ic-im-report
          path: |
            output/
            data/history.csv
            data/ingest_status.json
          retention-days: 30
          if-no-files-found: warn
  pages:
    needs: report
    if: ${{ vars.ENABLE_PAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ic-im-report
          path: artifact
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifact/output
      - name: Deploy report (opt-in)
        id: deployment
        uses: actions/deploy-pages@v4
  notify:
    needs: [report, pages]
    if: >-
      ${{ always() && needs.report.result == 'success' &&
      (needs.pages.result == 'success' || needs.pages.result == 'skipped') &&
      ((github.event_name == 'schedule' && (vars.ENABLE_PUSH == 'true' || vars.ENABLE_EMAIL == 'true')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.send_message || inputs.test_connection || inputs.send_email || inputs.test_email))) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: [wechat, email]
    permissions:
      contents: write
    env:
      CHANNEL: ${{ matrix.channel }}
      REPORT_DATE: ${{ needs.report.outputs.report_date }}
      REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
      SERVERCHAN_SENDKEY: ${{ matrix.channel == 'wechat' && secrets.SERVERCHAN_SENDKEY || '' }}
      SMTP_PASSWORD: ${{ matrix.channel == 'email' && secrets.SMTP_PASSWORD || '' }}
      SMTP_USERNAME: ${{ matrix.channel == 'email' && secrets.SMTP_USERNAME || '' }}
      MAIL_TO: ${{ matrix.channel == 'email' && secrets.MAIL_TO || '' }}
    steps:
      - name: Select explicitly enabled channel
        id: selection
        env:
          ENABLE_WECHAT: ${{ vars.ENABLE_PUSH }}
          ENABLE_EMAIL: ${{ vars.ENABLE_EMAIL }}
          SEND_WECHAT: ${{ inputs.send_message }}
          TEST_WECHAT: ${{ inputs.test_connection }}
          SEND_EMAIL: ${{ inputs.send_email }}
          TEST_EMAIL: ${{ inputs.test_email }}
        shell: bash
        run: |
          enabled=false
          mode=--notify-only
          if [[ "$CHANNEL" == "email" ]]; then
            configured=$ENABLE_EMAIL
            requested=$SEND_EMAIL
            test=$TEST_EMAIL
          else
            configured=$ENABLE_WECHAT
            requested=$SEND_WECHAT
            test=$TEST_WECHAT
          fi
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$configured" == "true" ]] ||
             [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && ( "$requested" == "true" || "$test" == "true" ) ]]; then
            enabled=true
          fi
          [[ "$test" != "true" ]] || mode=--test-notice
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.selection.outputs.enabled == 'true'
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        if: steps.selection.outputs.enabled == 'true'
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        if: steps.selection.outputs.enabled == 'true'
        with:
          name: ic-im-report
          path: .
      - name: Reserve submission without sending
        if: steps.selection.outputs.enabled == 'true'
        env:
          RETRY_PUSH: ${{ inputs.retry_push }}
          NOTICE_MODE: ${{ steps.selection.outputs.mode }}
        shell: bash
        run: |
          flags=()
          [[ "$RETRY_PUSH" != "true" ]] || flags+=(--retry-push)
          python monitor.py "$NOTICE_MODE" --channel "$CHANNEL" --reserve-only "${flags[@]}"
      - name: Durably save reservation before API call
        if: steps.selection.outputs.enabled == 'true'
        run: |
          git config user.name 'ic-monitor-bot'
          git config user.email 'ic-monitor-bot@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Reserve daily notification before submission'
            git push
          fi
      - name: Submit today's report after publication
        if: steps.selection.outputs.enabled == 'true'
        env:
          NOTICE_MODE: ${{ steps.selection.outputs.mode }}
        shell: bash
        run: |
          python monitor.py "$NOTICE_MODE" --channel "$CHANNEL" --use-reservation
      - name: Persist notification state on success or failure
        if: ${{ always() && steps.selection.outputs.enabled == 'true' }}
        run: |
          git config user.name 'ic-monitor-bot'
          git config user.email 'ic-monitor-bot@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Record notification submission state'
            git push
          fi
  failure_alert:
    needs: [report, pages, notify]
    if: >-
      ${{ always() &&
      (needs.report.result == 'failure' || needs.pages.result == 'failure' || needs.notify.result == 'failure') &&
      ((github.event_name == 'schedule' && (vars.ENABLE_PUSH == 'true' || vars.ENABLE_EMAIL == 'true')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.send_message || inputs.test_connection || inputs.send_email || inputs.test_email))) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: [wechat, email]
    permissions:
      contents: write
    env:
      CHANNEL: ${{ matrix.channel }}
      REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
      SERVERCHAN_SENDKEY: ${{ matrix.channel == 'wechat' && secrets.SERVERCHAN_SENDKEY || '' }}
      SMTP_PASSWORD: ${{ matrix.channel == 'email' && secrets.SMTP_PASSWORD || '' }}
      SMTP_USERNAME: ${{ matrix.channel == 'email' && secrets.SMTP_USERNAME || '' }}
      MAIL_TO: ${{ matrix.channel == 'email' && secrets.MAIL_TO || '' }}
    steps:
      - name: Select explicitly enabled alert channel
        id: selection
        env:
          ENABLE_WECHAT: ${{ vars.ENABLE_PUSH }}
          ENABLE_EMAIL: ${{ vars.ENABLE_EMAIL }}
          SEND_WECHAT: ${{ inputs.send_message }}
          TEST_WECHAT: ${{ inputs.test_connection }}
          SEND_EMAIL: ${{ inputs.send_email }}
          TEST_EMAIL: ${{ inputs.test_email }}
        shell: bash
        run: |
          enabled=false
          if [[ "$CHANNEL" == "email" ]]; then
            configured=$ENABLE_EMAIL
            requested=$SEND_EMAIL
            test=$TEST_EMAIL
          else
            configured=$ENABLE_WECHAT
            requested=$SEND_WECHAT
            test=$TEST_WECHAT
          fi
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$configured" == "true" ]] ||
             [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && ( "$requested" == "true" || "$test" == "true" ) ]]; then
            enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.selection.outputs.enabled == 'true'
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        if: steps.selection.outputs.enabled == 'true'
        with:
          python-version: '3.12'
      - name: Reserve failure alert without sending
        if: steps.selection.outputs.enabled == 'true'
        run: python monitor.py --failure-notice --channel "$CHANNEL" --reserve-only
      - name: Durably save alert reservation before API call
        if: steps.selection.outputs.enabled == 'true'
        run: |
          git config user.name 'ic-monitor-bot'
          git config user.email 'ic-monitor-bot@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Reserve failure alert before submission'
            git push
          fi
      - name: Send one daily failure alert
        if: steps.selection.outputs.enabled == 'true'
        env:
          MONITOR_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python monitor.py --failure-notice --channel "$CHANNEL" --use-reservation
      - name: Persist alert state
        if: ${{ always() && steps.selection.outputs.enabled == 'true' }}
        run: |
          git config user.name 'ic-monitor-bot'
          git config user.email 'ic-monitor-bot@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Record failure alert state'
            git push
          fi
